name: Enhancement
description: Suggest a language feature or a change to the compiler
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome, for the language itself as well as for the
        compiler and its diagnostics.

        If you are not sure whether something is a missing feature or an
        existing one you haven't found, open it anyway - [GHUL.md](https://github.com/degory/ghul/blob/main/GHUL.md)
        and [ghul.dev](https://ghul.dev) are both incomplete, and a question
        that turns out to be a documentation gap is worth having.

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The change itself, described as briefly as it can be.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: What it would let you do
      description: >
        The problem behind the suggestion. What you are trying to write, and
        what makes it awkward today.
    validations:
      required: true

  - type: textarea
    id: sketch
    attributes:
      label: How it might look
      description: >
        If it's a language feature, a sketch of the syntax - it doesn't have to
        be thought through. This becomes a code block, so no backticks needed.
      render: text
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it now
      description: >
        What you write today instead, or how another language you use handles
        the same thing.
    validations:
      required: false
