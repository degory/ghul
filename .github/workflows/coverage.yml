name: Coverage

# Measures how much of the compiler's own ghūl source the end-to-end suites
# execute. Deliberately kept off the pull-request path: instrumentation slows
# the integration suite by roughly an order of magnitude, which is fine for a
# periodic run but would not fit the PR gate's budget.
on:
  schedule:
    # Mondays and Thursdays, 03:00 UTC.
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Capture test coverage

    # Smaller than the integration-test job. Every instrumented compiler
    # process merges its hit counts through one mutex-guarded file, so
    # throughput stops tracking core count well before the 16 vCPU that job
    # uses, and the run is billed for size as well as duration.
    runs-on: ubicloud-standard-8

    # Measured on 8 cores: unit a few seconds, analysis a little under 5
    # minutes, integration a little under 20. Cross-assembly is not yet
    # measured, but is a smaller suite than integration by test count. The
    # report is only written once every suite has finished, so a run that
    # hits this limit is lost entirely rather than partly salvaged — keep the
    # headroom generous until a live run gives a real total.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/.config/dotnet-tools.json

      - name: Restore local .NET tools
        run: dotnet tool restore

      # The manifest pin is only a fallback; the rest of CI builds with the
      # latest published compiler, so coverage should reflect the same thing.
      - name: Use the latest published compiler
        run: dotnet tool update --local ghul.compiler

      # Builds the compiler with debug information, instruments it, and runs
      # every suite — unit, integration, cross-assembly, analysis — against
      # the instrumented build. The script appends its own summary to the job
      # summary.
      - name: Capture coverage
        run: ./build/coverage.sh --suite all

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/report/
          retention-days: 30

  deploy:
    name: Publish coverage report
    needs: coverage

    # Only a scheduled run, or a manual dispatch on main, publishes — a
    # workflow_dispatch on some other ref can be used to try the job out
    # without touching the live report.
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # deploy runs on its own runner, with none of the coverage job's
      # filesystem — fetch the report the previous job uploaded.
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage-report

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
