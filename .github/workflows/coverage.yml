name: Coverage

# Measures how much of the compiler's own ghūl source the end-to-end suites
# execute. Deliberately kept off the pull-request path: instrumentation slows
# the integration suite by roughly an order of magnitude, which is fine for a
# periodic run but would not fit the PR gate's budget.
on:
  schedule:
    # Mondays and Thursdays, 03:00 UTC.
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Capture test coverage

    # Smaller than the integration-test job. Every instrumented compiler
    # process merges its hit counts through one mutex-guarded file, so
    # throughput stops tracking core count well before the 16 vCPU that job
    # uses, and the run is billed for size as well as duration.
    runs-on: ubicloud-standard-8

    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/.config/dotnet-tools.json

      - name: Restore local .NET tools
        run: dotnet tool restore

      # The manifest pin is only a fallback; the rest of CI builds with the
      # latest published compiler, so coverage should reflect the same thing.
      - name: Use the latest published compiler
        run: dotnet tool update --local ghul.compiler

      # Builds the compiler with debug information, instruments it, and runs
      # the integration and cross-assembly suites against the instrumented
      # build. The script appends its own summary to the job summary.
      - name: Capture coverage
        run: ./build/coverage.sh --suite all

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/report/
          retention-days: 30
