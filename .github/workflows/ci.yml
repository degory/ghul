# CI/CD pipeline. 

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches: [main]

# Serialize builds: pushes to a given ref run one at a time so concurrent
# builds can't race over version numbers or the published package. PR builds
# keep their own per-ref group and cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Most jobs run on a GitHub-hosted runner, which is free on a public
# repository and has no practical cap on how many run at once. The suites a
# bigger machine used to carry are divided into shards instead, so their wall
# time falls with the number of runners rather than with the size of any one
# of them.
#
# The analysis tests are the one job that does not respond to sharding: they
# are one MSTest assembly, so there is no shard to cut them into, and they set
# the end to end time on their own. The lever if that becomes painful is the
# harness's parallelism, not a larger runner - past 8 vCPU buys nothing,
# because the bottleneck is per-test compiler-subprocess IPC.
#
# Two events, two shapes. A pull request runs the whole suite on the pull
# request merged with main as it stood when the run started, and merges once
# that run and the review pass. A push to main is the release build: it runs
# the whole suite again on the commit that landed, since main may have moved
# under the pull request after its run, and packs and publishes the release
# from that tree. `gate` is the one verdict the publish jobs wait on.
#
# This is a default for well-meant contributions, not a control. A `pull_request`
# run uses the workflow file from the pull request itself, so a contributor can
# simply write a different `runs-on`. What actually limits what a fork's pull
# request can spend is the approval requirement under Settings -> Actions, and
# only its "all external contributors" setting keeps applying once someone has
# had a first contribution merged.
#
# A push inside someone else's fork needs no guard at all: it runs in their
# repository, billed to them.

env:
  CI: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  version:
    name: Create a version number
    runs-on: ubuntu-latest
    # Longer than the ten minutes the wait for a release build in flight
    # can take below, so that wait gives up with a warning rather than the
    # job being cancelled.
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}
      compiler: ${{ steps.compiler_version.outputs.compiler }}

    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    # Compute the next version: the patch bump of the latest vX.Y.Z tag, unless
    # the checked-in VERSION file declares a higher minor/major floor (a marker
    # in a commit or PR body can no longer trigger a bump). Pull request builds
    # get a -beta.<run> prerelease so they never collide with a real release.
    # The action only reads the repo - it never tags or releases.

    - name: Determine the version
      id: version
      uses: ghul-lang/create-version@v1.0.0
      with:
        prerelease: ${{ github.event_name == 'pull_request' && format('beta.{0}', github.run_number) || '' }}

    # Resolve the ghul.compiler version that bootstraps this build: the
    # latest published version that is actually downloadable from NuGet
    # (skipping a release still propagating). A pull request and the
    # release build resolve it the same way.
    #
    # The bootstrap compiler version is published as the
    # `bootstrap-compiler-version` artifact; on a release run that is the
    # diagnostic record of what compiled the release, for as long as the
    # artifact is retained.
    - name: Determine bootstrap compiler version
      id: compiler_version
      shell: bash
      run: |
        set -euo pipefail

        resolve_latest() {
          local versions v
          versions=$(curl -fsSL https://api.nuget.org/v3-flatcontainer/ghul.compiler/index.json \
            | jq -r '.versions | reverse | .[]')
          for v in ${versions}; do
            case "${v}" in *-*) continue ;; esac
            # Skip versions unlisted on nuget.org (e.g. a withdrawn or
            # mis-numbered release). Unlisted versions remain in the
            # flat-container index and stay downloadable, so without this check
            # the resolver would keep selecting the highest such version forever.
            curl -fsSL --compressed "https://api.nuget.org/v3/registration5-gz-semver2/ghul.compiler/${v}.json" \
              | jq -e '.listed' >/dev/null || continue
            if curl -fsI "https://api.nuget.org/v3-flatcontainer/ghul.compiler/${v}/ghul.compiler.${v}.nupkg" >/dev/null 2>&1; then
              printf '%s' "${v}"
              return 0
            fi
          done
          echo "no downloadable ghul.compiler version found" >&2
          return 1
        }

        compiler=$(resolve_latest)

        echo "compiler=${compiler}" >> "$GITHUB_OUTPUT"
        echo "Bootstrap compiler: ${compiler}"
        echo "Bootstrap compiler: \`${compiler}\`" >> "$GITHUB_STEP_SUMMARY"
        mkdir -p artifact
        printf '%s\n' "${compiler}" > artifact/bootstrap-compiler-version.txt

    - name: Upload bootstrap compiler version
      uses: actions/upload-artifact@v7
      with:
        name: bootstrap-compiler-version
        path: artifact/


  # Built by the compiler this commit produces, not by the one that
  # bootstrapped it. The unit tests are compiled ghul source like any
  # other consumer, so building them with the previous release hides
  # every change to what the compiler accepts: the suite passes against
  # rules the merged compiler no longer applies, and the next pull
  # request is the one that fails. Waiting on `bootstrap` costs this job
  # its head start, which is the same trade every other test job makes.
  unit_tests:
    name: Run unit tests
    needs: [version, bootstrap]
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Set build number
      run: |
        echo "namespace Source is class BUILD is number: string static => \"${{ needs.version.outputs.tag }}\"; si si" >src/source/build.ghul

    - name: Run unit tests
      run: dotnet test unit-tests

    - name: Run WebAssembly library unit tests
      run: dotnet test wasm/tests/wasm-tests.ghulproj

    # The unit tests pin bytes; this asks an engine whether it accepts
    # them. Node is required, so a missing engine fails the step rather
    # than leaving it to check nothing.
    - name: Set up Node.js for WebAssembly validation
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Validate the WebAssembly module matrix in an engine
      run: wasm/tests/engine-check.sh
      env:
        WASM_ENGINES: node

    - name: Run LLVM library unit tests
      run: dotnet test llvm/tests/llvm-tests.ghulproj

    # The unit tests pin text; this asks LLVM whether it accepts it. The
    # tools are LLVM 23, the release ghul-llvm is built from, and the script fails
    # when it finds none.
    - name: Install the LLVM tools
      run: |
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/apt.llvm.org.gpg
        codename=$(lsb_release -cs)
        echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
        sudo apt-get update -qq
        sudo apt-get install -y -qq llvm-23

    - name: Check the LLVM module matrix with LLVM's own tools
      run: llvm/tests/llvm-check.sh

  # The compiler compiles itself, the compiler that produces does the same,
  # and the two agree byte for byte. Everything downstream then consumes
  # the third pass, so what the tests run and what the feed receives is a
  # compiler emitted by the emitter in this commit, rather than by the last
  # published one.
  #
  # That distinction is not academic. A single-pass build is emitted by the
  # previous release, so a defect in the new back end that only shows when
  # the compiler itself carries it is invisible to every test: the whole
  # suite passed while the back end could not produce a working compiler,
  # because nothing under test had been through it.
  #
  # A failure here therefore stops the test jobs rather than merely
  # reporting alongside them. That is deliberate: a compiler that cannot
  # reproduce itself makes the suite's verdict meaningless.

  bootstrap:
    needs: [version]
    name: Bootstrap compiler

    # Three sequential compiler passes, and the compiler does not
    # parallelise its source walk, so cores past the second buy nothing
    # and only single-core speed would: a paid ubicloud-standard-2 ran
    # this in 95s against 121s here, and that is the whole difference.
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Install the bootstrap compiler
      run: |
        for attempt in 1 2 3 4 5; do
          if dotnet tool update --local ghul.compiler --allow-downgrade --version ${{ needs.version.outputs.compiler }}; then
            exit 0
          fi
          echo "install attempt ${attempt} failed; retrying in 15s..."
          sleep 15
        done
        exit 1

    - name: Bootstrap
      env:
        CI: true
        PACKAGE_VERSION: ${{ needs.version.outputs.package }}
      run: ./build/bootstrap.sh

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-package
        path: ./nupkg/ghul.compiler.${{ needs.version.outputs.package }}.nupkg

    # Separate artefact for consumers that need to spawn the bootstrapped
    # compiler as a process (e.g. analysis_tests). The whole tool tree is
    # required, not just ghul.dll: the .NET host needs ghul.runtimeconfig.json
    # / ghul.deps.json beside the dll, and the compiler needs its sibling
    # assemblies (ghul-runtime, System.IO.Abstractions, ...).
    - name: Extract compiler tool tree
      run: |
        unzip -o nupkg/ghul.compiler.${{ needs.version.outputs.package }}.nupkg \
          'tools/net10.0/any/*' -d extracted-tool

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-tool
        path: ./extracted-tool/tools/net10.0/any

    # The analysis protocol client library ships as its own package so
    # out-of-repo tools can drive the compiler's analysis mode. Packed with
    # the same version as the compiler built from this commit.
    - name: Pack analysis protocol library
      run: dotnet pack analysis-protocol/analysis-protocol.ghulproj -nologo -p:CI=true -p:Version=${{ needs.version.outputs.package }}

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-analysis-protocol-package
        path: ./analysis-protocol/nupkg/ghul.analysis.protocol.${{ needs.version.outputs.package }}.nupkg


  # The suite is far larger than one runner can hold: on 4 vCPU it takes
  # around eight minutes end to end. `--shard` divides it between runners
  # instead, striped by discovery order so no shard collects a whole
  # directory of like-cost tests. Each shard reports its share of the
  # discovered tests, so the log shows none was dropped.
  #
  # Five shards rather than more: the account runs at most twenty jobs at
  # once, and with pull request runs, release builds and reviews sharing
  # them, further shards wait for a runner rather than run in parallel, and
  # each one adds its own setup time.
  #
  # This job is not the required status check - `integration_tests` below
  # is, and its name is what branch protection lists. Changing the shard
  # count is therefore a change to this file alone.
  integration_shards:
    needs: [version, bootstrap]
    name: Integration shard

    runs-on: ubuntu-latest

    timeout-minutes: 15

    strategy:
      # One shard failing says nothing about the others, and a rerun to find
      # out costs another bootstrap.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    # A test that runs under wasm through a `targets` file is compiled
    # against ghul-core and the runtime's wasm sources: a wasm build loads
    # no assemblies, so the two libraries come from their checkouts, and
    # the module runs under Node.
    - name: Checkout ghul-core
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-core
        path: libraries/ghul-core

    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: libraries/ghul-runtime

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    # The `ci` configuration in ghul-test.json: the compiler installed above
    # as the local tool, the runtime the bootstrapped compiler ships with, and
    # the library checkouts above for a test that runs under wasm.
    - name: Run integration tests
      run: bash -c "set -o pipefail ; dotnet ghul-test --config ci --shard ${{ matrix.shard }}/5 integration-tests | tee test-results.txt"

    - uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.shard }}
        path: test-results.txt


  # The required status check. A shard's own job carries the matrix leg in
  # its name, so the name changes whenever the shard count does; this job's
  # does not, which keeps the shard count out of branch protection.
  #
  # `always()` is load-bearing. Without it a failed bootstrap skips the
  # shards, which skips this job, and a skipped job satisfies a required
  # check - so the pull request would show this green over a compiler that
  # never built. With it the job runs regardless and judges the result
  # itself.
  integration_tests:
    needs: [version, integration_shards]
    name: Run integration tests

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - name: Check every shard passed
      env:
        RESULT: ${{ needs.integration_shards.result }}
      run: |
        echo "shards: $RESULT"
        [ "$RESULT" = success ]


  # Drives --analyse, which emits nothing. It still needs the emission
  # surface, because its fixtures build the analysis-protocol library
  # with the freshly built compiler - which is why it could not run
  # while that library came out empty.
  analysis_tests:
    needs: [version, bootstrap]
    name: Run analysis tests

    runs-on: ubuntu-latest

    # The longest single job in the run, since one MSTest assembly cannot be
    # sharded: about three minutes on a GitHub-hosted runner.
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    # Build the test runner with the freshly-built compiler - the same one the
    # tests spawn as the compiler under test (the bootstrapped artefact's
    # ghul.dll, via ANALYSIS_TESTS_COMPILER_DLL). Building the harness with the
    # compiler it validates means a breaking language change that invalidates
    # the harness source fails here in its own PR, rather than landing latently
    # and breaking the next PR once the new compiler publishes.
    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Run analysis tests
      env:
        ANALYSIS_TESTS_COMPILER_DLL: ${{ github.workspace }}/bootstrap-tool/ghul.dll
      run: dotnet test analysis-tests -p:SkipCompilerProjectRef=true

  # The wasm integration tests compare what the compiler said and the text
  # form it wrote, but no engine reads the modules. This builds each one
  # again with the bootstrapped compiler and has Node validate it.
  wasm_validation:
    needs: [version, bootstrap]
    name: Validate wasm modules

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    # The script runs the compiler at publish/ghul.dll, so the bootstrapped
    # tool tree goes where a local `dotnet publish` would put it.
    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: publish

    - name: Validate the wasm test modules in Node
      run: build/wasm-validate.sh

  # The llvm target's integration tests, built and run as a user's build
  # would build and run them: the compiler hands each module to the
  # ghul-llvm release fetched from GitHub, in an image holding the .NET SDK
  # and nothing to compile, assemble or link C with, so a program that needs
  # anything from the machine fails here. Run at both optimisation levels,
  # since a test that passes at one and not the other is a backend bug or a
  # missing check. The programs are then run again in an empty image by
  # llvm_static.
  llvm_tests:
    needs: [version, bootstrap]
    name: Run llvm tests (${{ matrix.optimisation }})

    runs-on: ubuntu-latest

    container: mcr.microsoft.com/dotnet/sdk:10.0

    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        optimisation: [O2, O0]

    steps:
    - uses: actions/checkout@v7

    - name: Check the image cannot build C
      run: |
        for tool in cc gcc clang ld ld.lld as opt llc; do
          if command -v "$tool"; then
            echo "::error::$tool is installed"
            exit 1
          fi
        done

        if [ -e /usr/include/stdio.h ]; then
          echo "::error::the C library's headers are installed"
          exit 1
        fi

    # The llvm configuration and llvm-validate.sh both run the compiler at
    # publish/ghul.dll.
    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: publish

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Checkout ghul-core
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-core
        path: libraries/ghul-core

    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: libraries/ghul-runtime

    - name: Fetch ghul-llvm
      run: dirname "$(build/ghul-llvm.sh "$RUNNER_TEMP/ghul-llvm")" >> "$GITHUB_PATH"

    # The compiler has no option for the optimisation level yet, so -O0 is
    # passed to ghul-llvm by a wrapper the compiler runs in its place. This
    # step goes once the compiler's debug option chooses -O0.
    - name: Optimise at -O0
      if: matrix.optimisation == 'O0'
      run: |
        printf '#!/bin/sh\nexec "%s" -O0 "$@"\n' "$(command -v ghul-llvm)" > "$RUNNER_TEMP/ghul-llvm-O0"
        chmod +x "$RUNNER_TEMP/ghul-llvm-O0"
        echo "GHUL_LLVM=$RUNNER_TEMP/ghul-llvm-O0" >> "$GITHUB_ENV"

    - name: Run the llvm integration tests
      env:
        GHUL_TEST_KEEP_ARTIFACTS: 1
      run: bash -c "set -o pipefail ; dotnet ghul-test --config llvm integration-tests | tee test-results.txt"

    - name: Validate the llvm test modules
      if: matrix.optimisation == 'O2'
      run: build/llvm-validate.sh

    - name: Collect the programs
      run: build/llvm-programs.sh collect integration-tests llvm-programs

    - uses: actions/upload-artifact@v7
      with:
        name: llvm-programs-${{ matrix.optimisation }}
        path: llvm-programs

  # Runs the programs llvm_tests built in a `FROM scratch` image, which holds
  # nothing but the programs themselves: no loader, no shared libraries, no
  # files. A program that is not fully static fails to start there. This is
  # a separate job because the SDK image llvm_tests runs in has no docker.
  llvm_static:
    needs: [version, llvm_tests]
    name: Run llvm programs in an empty image (${{ matrix.optimisation }})

    runs-on: ubuntu-latest

    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        optimisation: [O2, O0]

    steps:
    - uses: actions/checkout@v7

    - name: Download the programs
      uses: actions/download-artifact@v8
      with:
        name: llvm-programs-${{ matrix.optimisation }}
        path: llvm-programs

    # Artifacts do not keep the execute bit.
    - name: Make the programs executable
      run: chmod +x llvm-programs/*/program

    - name: Run the programs in an empty image
      run: build/llvm-programs.sh run llvm-programs

  # The formatter is the AST serializer, so its output has to parse back to
  # the same tree. Nothing else tests that: its unit and analysis-mode tests
  # each check one construct against a snapshot, and a snapshot only says the
  # output is what it was last time, not that it is still ghul. This runs the
  # whole compiler through it and builds what comes out, which is the check
  # the tool exists to pass - and the one that would have caught every defect
  # #2288 lists.
  format_round_trip:
    needs: [version, bootstrap]
    name: Run formatter round trip

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    # The formatting is done by the compiler this commit produces, and so is
    # the build of what it wrote: a formatter defect and the acceptance of
    # its output are the same commit's responsibility.
    - name: Format the compiler's own source and build it
      env:
        GHUL_COMPILER_DLL: ${{ github.workspace }}/bootstrap-tool/ghul.dll
      run: ./build/format-round-trip.sh

  # Real .ghulproj builds against a separate assembly, so they need the
  # emission surface too.
  cross_assembly_shards:
    needs: [version, bootstrap]
    name: Cross-assembly shard

    # Each test is a `dotnet build`, so the suite is MSBuild-bound and
    # sharded like the integration tests. `cross_assembly_tests` below is
    # the required status check.
    runs-on: ubuntu-latest

    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    # The `ci-cross-assembly` configuration names the bootstrapped compiler
    # rather than letting each project resolve one. A
    # `dotnet build` picks its compiler from the tool manifest beside the
    # project, so without this the suite tests whatever that manifest
    # happens to hold and says so, reporting `compiler under test: whatever
    # each project resolves for itself`. It is the freshly built compiler
    # here only because an earlier step overwrote that manifest, which is a
    # thin thread to hang the whole point of the job on.
    - name: Run cross-assembly tests
      run: bash -c "set -o pipefail ; dotnet ghul-test --config ci-cross-assembly --shard ${{ matrix.shard }}/3 cross-assembly-tests | tee cross-assembly-test-results.txt"

    # Four tests, so run once rather than split across the shards.
    - name: Run source library tests
      if: matrix.shard == 1
      run: bash -c "set -o pipefail ; dotnet ghul-test --config ci-cross-assembly source-library-tests | tee source-library-test-results.txt"

    - uses: actions/upload-artifact@v7
      with:
        name: cross-assembly-test-results-${{ matrix.shard }}
        path: |
          cross-assembly-test-results.txt
          source-library-test-results.txt

  # The required status check; see the note on `integration_tests`.
  cross_assembly_tests:
    needs: [version, cross_assembly_shards]
    name: Run cross-assembly tests

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - name: Check every shard passed
      env:
        RESULT: ${{ needs.cross_assembly_shards.result }}
      run: |
        echo "shards: $RESULT"
        [ "$RESULT" = success ]

  bare_invocation_test:
    needs: [version, bootstrap]
    name: Run bare invocation test

    runs-on: ubuntu-latest

    timeout-minutes: 5

    # Compile and run a program with no project file and no arguments beyond
    # the source. This is the only path that reaches the compiler's
    # reference-assembly auto-discovery: MSBuild passes the full resolved
    # reference set with `-a`, and the ghul-test harness passes
    # `--sdk-ref-path`, so neither the integration nor the cross-assembly
    # suite can exercise it.
    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Compile and run a program with no project file
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p bare-invocation
        cd bare-invocation
        printf 'entry() is\n    IO.Std.write_line("hello, world");\nsi\n' > hello.ghul
        dotnet ghul-compiler hello.ghul
        actual=$(dotnet hello.exe)
        echo "${actual}"
        test "${actual}" = "hello, world"

    - name: Report usage for --help
      shell: bash
      run: |
        set -euo pipefail
        dotnet ghul-compiler --help > help.txt
        grep -q "usage: ghul-compiler" help.txt

  native_aot_test:
    needs: [version, bootstrap]
    name: Run Native AOT test

    runs-on: ubuntu-latest

    timeout-minutes: 25

    # Two things, both compiled by the Native AOT compiler rather than run
    # under the JIT: a program, which is the one the compiler's own emitted
    # IL is checked against, and the compiler itself, run over the smoke
    # integration tests. The first is written outside the checkout so that
    # the repository's own Directory.*.props do not apply to it. Each runs
    # under a timeout because the failures seen so far were hangs.
    #
    # Only the smoke subset of the integration tests, because the whole suite
    # under a compiler whose start-up is measured in milliseconds still
    # takes long enough to be worth not doing, and the subset covers every
    # feature tag.
    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Install the freshly-built compiler
      run: dotnet tool install ghul.compiler --tool-path "${RUNNER_TEMP}/ghul-compiler" --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Publish and run a program with Native AOT
      shell: bash
      run: |
        set -euo pipefail
        runtime_version=$(grep -oP 'Include="ghul.runtime" Version="\K[^"]+' Directory.Packages.props)
        project="${RUNNER_TEMP}/native-aot"
        mkdir -p "${project}"
        cat > "${project}/native-aot.ghulproj" <<EOF
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <OutputType>Exe</OutputType>
            <TargetFramework>net10.0</TargetFramework>
            <PublishAot>true</PublishAot>
            <GhulCompiler>${RUNNER_TEMP}/ghul-compiler/ghul-compiler</GhulCompiler>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="ghul.runtime" Version="${runtime_version}" />
            <GhulSources Include="*.ghul" />
          </ItemGroup>
        </Project>
        EOF
        cat > "${project}/program.ghul" <<'EOF'
        use IO.Std.write_line;
        use Collections.LIST;

        narrow(o: object) -> string is
            if let flag: bool = o then
                return "bool {flag}";
            fi

            return "not a bool";
        si

        twice[T](source: Collections.Iterable[T]) -> Collections.Iterable[T] is
            for item in source do
                yield item;
                yield item;
            od
        si

        entry() is
            let yes: object = true;
            let number: object = 42;

            write_line(narrow(yes));
            write_line(narrow(number));
            write_line("isa int?: {isa int?(number)}");

            for value in System.Linq.Enumerable.of_type[object](twice(LIST([1, 2]))) do
                write_line("{cast int(value)}");
            od
        si
        EOF
        dotnet publish "${project}/native-aot.ghulproj" -r linux-x64 -o "${project}/out"
        actual=$(timeout 30 "${project}/out/native-aot")
        echo "${actual}"
        test "${actual}" = "$(printf 'bool true\nnot a bool\nisa int?: true\n1\n1\n2\n2')"

    # The compiler compiled by the bootstrap compiler, so that its emitted IL
    # carries the emission fixes this branch made; built by a published
    # compiler it would carry the IL those fixes replace.
    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Publish the compiler with Native AOT
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p publish
        # ghul-runtime.dll is read as a reference assembly rather than
        # loaded, and wasm.dll is data the wasm target reads, so neither is
        # carried by the publish. Both come from the compiler package the
        # bootstrap job packed.
        for file in ghul-runtime.dll wasm.dll analysis-protocol.runtimeconfig.json; do
          cp "bootstrap-tool/${file}" publish/
        done
        dotnet publish ghul.ghulproj -c Release -r linux-x64 \
          -p:PublishAot=true \
          -p:CI=true \
          -p:Version=${{ needs.version.outputs.package }} \
          "-p:GhulCompiler=dotnet ${GITHUB_WORKSPACE}/bootstrap-tool/ghul.dll" \
          -o publish/

    # Analysis mode reads and writes the protocol by reflection, which a
    # trimmed build can break where the JIT one is fine, and the version it
    # reports is what an editor decides which features to use by. One edit
    # and one hover, checked for both.
    - name: Serve analysis requests under it
      shell: bash
      run: |
        set -euo pipefail
        # The newest reference pack only: a runner can carry more than one,
        # and two copies of an assembly cannot both be loaded.
        reference_pack=$(ls -d "${DOTNET_ROOT}"/packs/Microsoft.NETCore.App.Ref/10.* | sort -V | tail -n 1)
        references=()
        for assembly in "${reference_pack}"/ref/net10.0/*.dll; do
          references+=(-a "${assembly}")
        done
        work="${RUNNER_TEMP}/aot-analysis"
        mkdir -p "${work}"
        cd "${work}"
        printf '%s\n' \
          '{"command":"set_open_files","paths":["a.ghul"]}' \
          '{"command":"edit","files":[{"path":"a.ghul","source":"entry() is\n    let x: int = 1\nsi\n"}]}' \
          '{"command":"hover","path":"a.ghul","line":2,"column":9}' \
          | timeout 60 "${GITHUB_WORKSPACE}/publish/ghul" --analyse "${references[@]}" -a "${GITHUB_WORKSPACE}/publish/ghul-runtime.dll" \
          > responses.json 2> analyser.log || { cat analyser.log; exit 1; }
        cat analyser.log responses.json
        test "$(jq -r 'select(.kind == "listen") | .compiler_version' responses.json)" = "${{ needs.version.outputs.package }}"
        test "$(jq -r 'select(.kind == "hover") | .signature' responses.json)" = "x: int"
        if grep -q '"kind":"error"' responses.json; then exit 1; fi

    # The `published` configuration: the compiler published above, not the
    # ghul-compiler tool, which would test nothing this job published.
    - name: Run the smoke integration tests under it
      shell: bash
      run: dotnet ghul-test --config published --tag smoke integration-tests

    # The archive the installer script and ghul-cli fetch. Renamed to
    # `ghul-compiler`, the command of the .NET tool it stands in for, and
    # packed with the sibling files it needs: the compiler is statically
    # linked and carries its own runtime, so those four files are the whole
    # payload. Built here rather than in a job of its own so that what the
    # smoke tests exercised is what ships.
    - name: Pack the AOT compiler
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p aot/ghul-compiler
        cp publish/ghul aot/ghul-compiler/ghul-compiler
        for file in ghul-runtime.dll wasm.dll analysis-protocol.runtimeconfig.json; do
          cp "publish/${file}" aot/ghul-compiler/
        done
        tar -C aot -czf ghul-compiler-linux-x64.tar.gz ghul-compiler
        sha256sum ghul-compiler-linux-x64.tar.gz > ghul-compiler-linux-x64.tar.gz.sha256

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-aot
        path: |
          ghul-compiler-linux-x64.tar.gz
          ghul-compiler-linux-x64.tar.gz.sha256

  # Builds ghul-runtime against the freshly built compiler, so it needs
  # the emission surface to be complete rather than merely correct.
  runtime_tests:
    needs: [version, bootstrap]
    name: Run runtime tests

    runs-on: ubuntu-latest

    timeout-minutes: 15

    # Build ghul-runtime (latest main, no version pin) against the
    # bootstrapped compiler and run its unit tests. Same symmetry
    # contract as examples_tests: the new compiler must build current
    # ghul-runtime main, and current ghul-runtime main must build
    # under the previously-published compiler. Catches source-compat
    # regressions in the runtime before they require a runtime fix to
    # unstick - e.g. an inference change that silently breaks the
    # runtime test source.
    steps:
    # Pick `next` over `main` when it exists and is strictly ahead.
    # See docs/claude/breaking-change-coordination.md.
    - name: Resolve ghul-runtime ref
      id: ref
      shell: bash
      env:
        GIT_AUTH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        repo=ghul-lang/ghul-runtime
        # Authenticated, not anonymous: GitHub rate-limits the anonymous git
        # endpoint per IP and a busy runner pool exhausts it, which reads as
        # "could not read Username" and fails the job before any test runs.
        # The job token authenticates reads of public repositories.
        authed="https://x-access-token:${GIT_AUTH_TOKEN}@github.com/${repo}"
        main_sha=$(git ls-remote "${authed}" refs/heads/main | cut -f1)
        next_sha=$(git ls-remote "${authed}" refs/heads/next | cut -f1 || true)
        ref=main
        if [ -n "${next_sha}" ] && [ "${next_sha}" != "${main_sha}" ]; then
          # A partial clone can still be writing into .git as the trap
          # runs, so the remove races and reports "Directory not empty".
          # Under `set -e` that status becomes the step's, failing the job
          # on a scratch directory the runner discards anyway.
          tmp=$(mktemp -d) && trap "rm -rf '${tmp}' || true" EXIT
          git clone --quiet --filter=blob:none --no-checkout --branch=next --depth=200 "${authed}" "${tmp}"
          git -C "${tmp}" fetch --quiet --depth=200 origin main:refs/remotes/origin/main
          if git -C "${tmp}" merge-base --is-ancestor origin/main next; then
            ref=next
            echo "using ${repo}/next"
          fi
        fi
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: ghul-runtime
        ref: ${{ steps.ref.outputs.ref }}

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Install the freshly-built compiler in ghul-runtime
      working-directory: ghul-runtime
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source ../nupkg

    - name: Restore local .NET tools
      working-directory: ghul-runtime
      run: dotnet tool restore

    - name: Build ghul-runtime
      working-directory: ghul-runtime
      run: dotnet build

    - name: Run ghul-runtime unit tests
      working-directory: ghul-runtime
      run: dotnet test tests/tests.ghulproj

  # Builds ghul-examples against the freshly built compiler, so it
  # exercises the emission surface end to end: a consumer repository has
  # to compile against what the bootstrapped compiler produced.
  examples_tests:
    needs: [version, bootstrap]
    name: Run examples tests

    runs-on: ubuntu-latest

    timeout-minutes: 15

    # Build ghul-examples (latest main, no version pin) against the
    # bootstrapped compiler. ghul-examples has its own CI gating its
    # main, and the language is generally backwards-compatible, so the
    # contract is symmetric: the new compiler must build current
    # ghul-examples main, and current main ghul-examples must build
    # under the previously-published compiler. This job enforces the
    # first half. Runs on both PR and main push: it gates
    # publish_release_package, so a skipped run would silently block
    # publish on the post-merge run.
    steps:
    # Pick `next` over `main` when it exists and is strictly ahead.
    # See docs/claude/breaking-change-coordination.md.
    - name: Resolve ghul-examples ref
      id: ref
      shell: bash
      env:
        GIT_AUTH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        repo=ghul-lang/ghul-examples
        # Authenticated, not anonymous: GitHub rate-limits the anonymous git
        # endpoint per IP and a busy runner pool exhausts it, which reads as
        # "could not read Username" and fails the job before any test runs.
        # The job token authenticates reads of public repositories.
        authed="https://x-access-token:${GIT_AUTH_TOKEN}@github.com/${repo}"
        main_sha=$(git ls-remote "${authed}" refs/heads/main | cut -f1)
        next_sha=$(git ls-remote "${authed}" refs/heads/next | cut -f1 || true)
        ref=main
        if [ -n "${next_sha}" ] && [ "${next_sha}" != "${main_sha}" ]; then
          # A partial clone can still be writing into .git as the trap
          # runs, so the remove races and reports "Directory not empty".
          # Under `set -e` that status becomes the step's, failing the job
          # on a scratch directory the runner discards anyway.
          tmp=$(mktemp -d) && trap "rm -rf '${tmp}' || true" EXIT
          git clone --quiet --filter=blob:none --no-checkout --branch=next --depth=200 "${authed}" "${tmp}"
          git -C "${tmp}" fetch --quiet --depth=200 origin main:refs/remotes/origin/main
          if git -C "${tmp}" merge-base --is-ancestor origin/main next; then
            ref=next
            echo "using ${repo}/next"
          fi
        fi
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Checkout ghul-examples
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-examples
        path: ghul-examples
        ref: ${{ steps.ref.outputs.ref }}

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Install the freshly-built compiler in ghul-examples
      working-directory: ghul-examples
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source ../nupkg

    - name: Restore local .NET tools
      working-directory: ghul-examples
      run: dotnet tool restore

    - name: Build examples
      working-directory: ghul-examples
      run: dotnet build

    - name: Run examples integration tests
      working-directory: ghul-examples
      run: dotnet ghul-test integration-tests

  # Sharded, and gated by `rosetta_tests` below, for the reasons given on
  # the integration shards.
  rosetta_shards:
    needs: [version, bootstrap]
    name: Rosetta Code shard

    runs-on: ubuntu-latest

    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    # Build and run every ghul-rosetta-code task (latest main) against the
    # bootstrapped compiler. The tasks are the largest corpus of top-level
    # code, function literals and inferred locals outside the compiler,
    # and each carries an output-asserting test, so a change to inference
    # or narrowing that alters what a solution does shows up here.
    steps:
    # Pick `next` over `main` when it exists and is strictly ahead, as
    # the runtime and examples jobs do, so a compiler change the tasks
    # cannot build under until they are updated can land first.
    - name: Resolve ghul-rosetta-code ref
      id: ref
      shell: bash
      env:
        GIT_AUTH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        repo=ghul-lang/ghul-rosetta-code
        authed="https://x-access-token:${GIT_AUTH_TOKEN}@github.com/${repo}"
        main_sha=$(git ls-remote "${authed}" refs/heads/main | cut -f1)
        next_sha=$(git ls-remote "${authed}" refs/heads/next | cut -f1 || true)
        ref=main
        if [ -n "${next_sha}" ] && [ "${next_sha}" != "${main_sha}" ]; then
          tmp=$(mktemp -d) && trap "rm -rf '${tmp}' || true" EXIT
          git clone --quiet --filter=blob:none --no-checkout --branch=next --depth=200 "${authed}" "${tmp}"
          git -C "${tmp}" fetch --quiet --depth=200 origin main:refs/remotes/origin/main
          if git -C "${tmp}" merge-base --is-ancestor origin/main next; then
            ref=next
            echo "using ${repo}/next"
          fi
        fi
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Checkout ghul-rosetta-code
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-rosetta-code
        path: ghul-rosetta-code
        ref: ${{ steps.ref.outputs.ref }}

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Install the freshly-built compiler in ghul-rosetta-code
      working-directory: ghul-rosetta-code
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source ../nupkg

    # The harness is the task repository's own, restored below from its
    # manifest, as the runtime and examples jobs do. The tasks are checked
    # out at that repository's head, and a task may use a harness feature
    # newer than anything this repository has needed - a `run.session`
    # driving an interactive solution, say - so the harness that matches
    # the corpus is the one pinned alongside it. A pin taken from here
    # instead goes stale silently: the harness ignores the file it does
    # not know about, the solution reads end of input at its first prompt,
    # and the diff blames the compiler under test.
    - name: Restore local .NET tools
      working-directory: ghul-rosetta-code
      run: dotnet tool restore

    # The task repository's default configuration builds a task with the
    # compiler alone when it references nothing but ghul.runtime, which has to
    # be in the package cache before the run decides; restoring any one task
    # puts it there.
    - name: Restore the runtime the tasks reference
      working-directory: ghul-rosetta-code
      run: dotnet restore "$(ls tasks/*/*.ghulproj | head -n 1)"

    # --compiler names the bootstrapped compiler in place of each task's own,
    # for the reason given on the cross-assembly tests.
    - name: Run Rosetta Code integration tests
      working-directory: ghul-rosetta-code
      run: dotnet ghul-test --compiler "dotnet ${GITHUB_WORKSPACE}/bootstrap-tool/ghul.dll" --shard ${{ matrix.shard }}/5 tasks


  # The required status check; see the note on `integration_tests`.
  rosetta_tests:
    needs: [version, rosetta_shards]
    name: Run Rosetta Code tests

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - name: Check every shard passed
      env:
        RESULT: ${{ needs.rosetta_shards.result }}
      run: |
        echo "shards: $RESULT"
        [ "$RESULT" = success ]

  # The one verdict the publish jobs wait on: every test job ran and passed.
  # A `needs` list cannot say that on its own - a skipped job in it skips the
  # dependent too unless the dependent runs `always()`, and then a skipped
  # job satisfies it - so this job runs regardless and checks each result.
  gate:
    needs: [version, bootstrap, unit_tests, analysis_tests, integration_tests, wasm_validation, llvm_tests, llvm_static, cross_assembly_tests, bare_invocation_test, native_aot_test, runtime_tests, examples_tests, format_round_trip, rosetta_tests]
    name: Gate

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - name: Check every required job passed
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        set -euo pipefail
        ok=true
        for job in $(echo "${RESULTS}" | jq -r 'keys[]'); do
          result=$(echo "${RESULTS}" | jq -r --arg j "${job}" '.[$j].result')
          echo "${job}: ${result}"
          [ "${result}" = success ] && continue
          echo "::error::${job}: ${result}"
          ok=false
        done
        [ "${ok}" = true ]

  # These three condition on the gate explicitly rather than through `needs`
  # alone: a job's default condition is false when any job upstream of it
  # was skipped, however far upstream. `!cancelled()` opts out of that rule
  # and the gate's own result is what stands in for it.
  publish_beta_package:
    needs: [version, gate]
    name: Publish beta package

    timeout-minutes: 5

    runs-on: ubuntu-latest

    # Declared rather than inherited: this repository's default workflow token
    # is read-only, and pushing to the GitHub feed needs packages:write.
    permissions:
      contents: read
      packages: write

    # Skipped on a fork regardless: GitHub downgrades the token a fork's pull
    # request gets to read-only, so the scope above cannot be granted there.
    if: ${{ !cancelled() && needs.gate.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    steps:
    - uses: actions/checkout@v7

    - name: Download ghul compiler tool package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download analysis protocol package
      uses: actions/download-artifact@v8
      with:
        name: ghul-analysis-protocol-package
        path: nupkg

    - name: Publish beta package to GitHub
      run: dotnet nuget push ./nupkg/ghul.compiler.${{ needs.version.outputs.package }}.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/ghul-lang/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish analysis protocol beta package to GitHub
      run: dotnet nuget push ./nupkg/ghul.analysis.protocol.${{ needs.version.outputs.package }}.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/ghul-lang/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_release_package:
    needs: [version, gate]
    name: Publish release package

    timeout-minutes: 5

    runs-on: ubuntu-latest

    # Declared rather than inherited: this repository's default workflow token
    # is read-only, and pushing to the GitHub feed needs packages:write.
    permissions:
      contents: read
      packages: write

    if: ${{ !cancelled() && needs.gate.result == 'success' && github.event_name == 'push' }}

    steps:
    - uses: actions/checkout@v7

    - name: Download ghul compiler tool package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download analysis protocol package
      uses: actions/download-artifact@v8
      with:
        name: ghul-analysis-protocol-package
        path: nupkg

    - name: Publish release package to GitHub
      run: dotnet nuget push ./nupkg/ghul.compiler.${{ needs.version.outputs.package }}.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/ghul-lang/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish release package to NuGet
      run: dotnet nuget push ./nupkg/ghul.compiler.${{ needs.version.outputs.package }}.nupkg -k ${NUGET_TOKEN} -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
      env:
        NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}

    - name: Publish analysis protocol release package to GitHub
      run: dotnet nuget push ./nupkg/ghul.analysis.protocol.${{ needs.version.outputs.package }}.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/ghul-lang/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish analysis protocol release package to NuGet
      run: dotnet nuget push ./nupkg/ghul.analysis.protocol.${{ needs.version.outputs.package }}.nupkg -k ${NUGET_TOKEN} -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
      env:
        NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}

  create_release:
    needs: [version, gate, publish_release_package]
    name: Create release
    runs-on: ubuntu-latest

    timeout-minutes: 5
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.publish_release_package.result == 'success' && github.event_name == 'push' }}

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download the AOT compiler archive
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-aot
        path: aot

    # A push to main is normally one squashed pull request; the range covers
    # a direct push of several commits too, and the notes list each.
    - name: Create changelog
      run: |
        range="${{ github.event.before }}..${{ github.sha }}"
        git rev-parse -q --verify "${{ github.event.before }}^{commit}" >/dev/null || range="-1"
        git log --format="%s%n%n%b%n%n" ${range} >changelog.txt

    - name: Create a release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.version.outputs.tag }}" \
          ./nupkg/ghul.compiler.${{ needs.version.outputs.package }}.nupkg \
          ./aot/ghul-compiler-linux-x64.tar.gz \
          ./aot/ghul-compiler-linux-x64.tar.gz.sha256 \
          --title "${{ needs.version.outputs.tag }}" \
          --notes-file changelog.txt
